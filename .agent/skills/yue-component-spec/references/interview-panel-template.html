<!doctype html>
<!--
  AGENT INSTRUCTIONS — this file is the canonical interview panel template.

  For each component interview:
  1. Create directory   interviews/{component-kebab}/
  2. Copy this file to  interviews/{component-kebab}/panel.html   (generated shell)
  3. Write              interviews/{component-kebab}/data.js       (see data-template.js)

  The panel loads ./data.js automatically. Open panel.html in a browser.
  Generated panels carry the template version; answers use schema v2.
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yue Design · 组件设计访谈</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f6f7;
        --surface-hover: #f0f1f2;
        --border: #e4e5e7;
        --border-strong: #d3d5d8;
        --fg: #131416;
        --fg-secondary: #6b6e73;
        --fg-tertiary: #9a9da2;
        --accent: #3f6a8f;
        --accent-soft: #eef3f7;
        --accent-border: #c4d5e2;
        --danger: #a3402f;
        --danger-soft: #faf1ef;
        --danger-border: #e6c7bf;
        --ok: #3d7a52;
        --radius-sm: 6px;
        --radius-md: 10px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;
        --space-6: 48px;
        --header-h: 64px;
      }

      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-button,
      ::-webkit-scrollbar-button:single-button {
        display: none;
        width: 0;
        height: 0;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
        border: 2px solid var(--bg);
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--fg-tertiary);
        background-clip: padding-box;
      }

      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
          "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        letter-spacing: 0.01em;
      }

      #pageScroll {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }

      #pageScroll.no-scroll {
        overflow: hidden;
      }

      .mono {
        font-family:
          ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      /* ---------- top bar ---------- */

      header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        height: var(--header-h);
        display: flex;
        align-items: center;
      }

      .header-inner {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 var(--space-4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
      }

      .brand-label {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .brand-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.25;
      }

      .brand-subtitle {
        font-size: 12.5px;
        color: var(--fg-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }

      .status-cluster {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex: 1 1 auto;
        min-width: 0;
        justify-content: flex-end;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .status-cluster::-webkit-scrollbar {
        display: none;
      }

      .progress {
        font-size: 13px;
        color: var(--fg-tertiary);
        white-space: nowrap;
        flex: none;
      }
      .progress b {
        color: var(--fg-secondary);
        font-weight: 600;
      }

      .btn {
        font-size: 13px;
        font-weight: 500;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--fg-secondary);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
      }

      .btn svg {
        width: 14px;
        height: 14px;
      }
      .btn:hover {
        background: var(--surface);
      }

      .btn.primary {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }
      .btn.primary:hover {
        background: #365d80;
      }

      .icon-btn {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--fg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .icon-btn svg {
        width: 14px;
        height: 14px;
      }
      .icon-btn:hover {
        background: var(--surface);
        color: var(--fg);
      }

      .status-divider {
        flex: none;
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 2px;
      }

      .toc-toggle {
        display: inline-flex;
      }
      .toc-toggle.is-open {
        color: var(--accent);
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .toc-toggle svg {
        transition: transform 0.2s ease;
      }

      /* ---------- incomplete banner ---------- */

      #incompleteBanner {
        display: none;
        max-width: 1080px;
        margin: var(--space-3) auto 0;
        padding: 0 var(--space-4);
      }
      #incompleteBanner.show {
        display: block;
      }

      .banner-box {
        border: 1px solid var(--danger-border);
        background: var(--danger-soft);
        border-radius: var(--radius-md);
        padding: var(--space-3);
      }
      .banner-box .banner-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        margin-bottom: var(--space-2);
      }
      .banner-box .banner-head span {
        font-size: 14px;
        color: var(--danger);
        font-weight: 600;
      }
      .banner-close {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 13px;
        padding: 3px 7px;
      }
      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        font-size: 12.5px;
        color: var(--danger);
        background: #fff;
        border: 1px solid var(--danger-border);
        border-radius: 6px;
        padding: 4px 9px;
        text-decoration: none;
      }
      .chip:hover {
        background: var(--danger-soft);
      }

      /* ---------- layout: sidebar + content ---------- */

      .layout {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 var(--space-4);
      }

      @media (min-width: 900px) {
        .layout {
          display: flex;
          align-items: flex-start;
        }
      }

      /* ---------- sidebar TOC ---------- */

      .toc-sidebar {
        display: none;
      }

      @media (min-width: 900px) {
        .toc-sidebar {
          display: block;
          flex: none;
          width: 224px;
          margin-right: 44px;
          overflow: hidden;
          position: sticky;
          top: calc(var(--header-h) + var(--space-4));
          max-height: calc(100vh - var(--header-h) - var(--space-5));
          padding: var(--space-4) 0;
          opacity: 1;
          transition:
            width 0.32s cubic-bezier(0.65, 0, 0.35, 1),
            margin-right 0.32s cubic-bezier(0.65, 0, 0.35, 1),
            opacity 0.22s ease;
        }
        .toc-sidebar.collapsed {
          width: 0;
          margin-right: 0;
          opacity: 0;
          pointer-events: none;
        }
        .toc-sidebar-inner {
          width: 224px;
          overflow-y: auto;
          max-height: calc(100vh - var(--header-h) - var(--space-5));
          scrollbar-width: thin;
          scrollbar-color: var(--border-strong) transparent;
        }
        .toc-sidebar-inner::-webkit-scrollbar {
          width: 5px;
        }
        .toc-sidebar-inner::-webkit-scrollbar-button {
          display: none;
          width: 0;
          height: 0;
        }
        .toc-sidebar-inner::-webkit-scrollbar-track {
          background: transparent;
        }
        .toc-sidebar-inner::-webkit-scrollbar-thumb {
          background: var(--border-strong);
          border-radius: 999px;
          border: none;
        }
        .toc-sidebar-inner::-webkit-scrollbar-thumb:hover {
          background: var(--fg-tertiary);
        }
      }

      @media (min-width: 900px) {
        .content-col {
          flex: 1;
          min-width: 0;
          transition: max-width 0.32s cubic-bezier(0.65, 0, 0.35, 1);
        }
      }

      main {
        max-width: 800px;
        margin: 0 auto;
        padding: var(--space-5) 0 0;
      }

      .toc-eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--fg-tertiary);
        margin: 0 0 var(--space-3);
        padding-left: 14px;
      }

      .toc-section {
        margin-bottom: 18px;
      }

      .toc-section-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 6px;
      }

      .toc-collapse-btn {
        flex: none;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        padding: 0;
        color: var(--fg-tertiary);
        border-radius: 4px;
      }
      .toc-collapse-btn:hover {
        color: var(--fg-secondary);
        background: var(--surface);
      }
      .toc-collapse-btn svg {
        width: 15px;
        height: 15px;
        transition: transform 0.18s ease;
      }
      .toc-collapse-btn[aria-expanded="false"] svg {
        transform: rotate(-90deg);
      }

      .toc-section-title {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
        padding: 3px 0;
        line-height: 1.4;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toc-section-title:hover {
        color: var(--accent);
      }

      .toc-list-wrap {
        margin-left: 22px;
        overflow: hidden;
        transition: max-height 0.22s ease;
      }
      .toc-list-wrap.collapsed {
        max-height: 0 !important;
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 1px solid var(--border);
      }

      .toc-item a {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 8px 5px 12px;
        margin-left: -1px;
        border-left: 2px solid transparent;
        font-size: 13.5px;
        color: var(--fg-secondary);
        text-decoration: none;
        line-height: 1.35;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .toc-item a:hover {
        color: var(--fg);
      }
      .toc-item a.active {
        color: var(--accent);
        border-left-color: var(--accent);
        font-weight: 600;
      }

      .toc-dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border-strong);
        transition: background 0.15s ease;
      }
      .toc-item a.answered .toc-dot {
        background: var(--ok);
      }
      .toc-item a.active .toc-dot {
        background: var(--accent);
      }

      .toc-id {
        flex: none;
        opacity: 0.65;
      }
      .toc-summary {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      /* ---------- mobile drawer ---------- */

      #tocDrawer {
        position: fixed;
        inset: 0;
        z-index: 50;
        visibility: hidden;
      }
      #tocDrawer .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(15, 16, 18, 0.36);
        opacity: 0;
        transition: opacity 0.22s ease;
      }
      #tocDrawer .panel {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 84%;
        max-width: 320px;
        background: var(--bg);
        transform: translateX(-100%);
        transition: transform 0.24s ease;
        padding: var(--space-4);
        overflow-y: auto;
        box-shadow: 12px 0 32px rgba(0, 0, 0, 0.1);
      }
      #tocDrawer.open {
        visibility: visible;
      }
      #tocDrawer.open .backdrop {
        opacity: 1;
      }
      #tocDrawer.open .panel {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--space-4);
      }
      .drawer-head h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .drawer-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .drawer-close svg {
        width: 14px;
        height: 14px;
      }

      /* ---------- main content ---------- */

      .intro {
        margin: 0 0 var(--space-5);
        padding-bottom: var(--space-4);
        border-bottom: 1px solid var(--border);
      }
      .intro p {
        margin: 0;
        font-size: 14px;
        color: var(--fg-secondary);
      }
      .intro .kbd-hint {
        display: none;
      }
      @media (min-width: 900px) {
        .intro .kbd-hint {
          display: inline;
          color: var(--fg-tertiary);
        }
      }
      kbd {
        font-family: inherit;
        font-size: 12px;
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 6px;
        margin: 0 1px;
        background: var(--surface);
        color: var(--fg-secondary);
      }

      section.group {
        margin-bottom: var(--space-6);
        scroll-margin-top: calc(var(--header-h) + 16px);
      }

      /* Round heading */
      .group-heading {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
        padding-bottom: var(--space-2);
        border-bottom: 2px solid var(--accent-soft);
      }
      .group-heading .idx {
        font-size: 12px;
        color: var(--fg-tertiary);
        flex: none;
      }
      .group-heading h2 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        color: var(--fg);
        flex: 1;
      }
      .round-copy-btn {
        font-size: 12.5px;
        font-weight: 500;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--accent-border);
        background: var(--accent-soft);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
        transition: background 0.15s ease;
      }
      .round-copy-btn:hover {
        background: #dde9f3;
      }
      .round-copy-btn svg {
        width: 13px;
        height: 13px;
      }
      .round-copy-btn.copied {
        color: var(--ok);
        border-color: var(--ok);
        background: #ecf6f0;
      }

      .q-card {
        scroll-margin-top: calc(var(--header-h) + 16px);
        padding: var(--space-4) 0;
        border-bottom: 1px solid var(--border);
        transition: background 0.6s ease;
      }
      .q-card:last-child {
        border-bottom: none;
      }
      .q-card.flash {
        background: var(--accent-soft);
      }
      .q-card.answered .q-id {
        color: var(--ok);
      }
      .q-card.blocked .q-id {
        color: #b45309;
      }
      .q-status {
        flex: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--fg-secondary);
        padding: 4px 7px;
        font: inherit;
        font-size: 12px;
      }
      .q-status-readonly {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        box-sizing: border-box;
        cursor: default;
      }
      .q-status-readonly.is-research {
        color: var(--accent);
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .open-answer,
      .question-input {
        width: 100%;
        box-sizing: border-box;
        margin: var(--space-2) 0 0 50px;
        max-width: calc(100% - 50px);
        min-height: 54px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        resize: vertical;
      }
      .decision-meta {
        margin: 6px 0 0 50px;
        font-size: 12px;
        color: var(--fg-tertiary);
      }
      .workflow-panel {
        margin: var(--space-6) 0;
        padding: var(--space-4);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .workflow-panel h2,
      .workflow-panel h3 {
        margin: 0 0 var(--space-2);
        font-size: 16px;
      }
      .workflow-panel p {
        margin: 0 0 var(--space-3);
        color: var(--fg-secondary);
        font-size: 13px;
      }
      .workflow-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: var(--space-3);
      }
      .workflow-actions label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        cursor: pointer;
      }
      .workflow-actions label.selected {
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .blocking-list {
        margin: 0;
        padding-left: 20px;
        color: #b45309;
        font-size: 13px;
      }
      .user-question-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: 8px;
        margin-bottom: 8px;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .user-question-row.is-resolved {
        background: #eef7f0;
        border-color: #c9e3cf;
      }
      .user-question-row.is-resolved textarea {
        color: var(--fg-secondary);
        background: transparent;
      }
      .user-question-row .resolve-question-btn {
        width: 112px;
        min-width: 112px;
        height: 40px;
        align-self: start;
        white-space: nowrap;
      }
      .user-question-row textarea {
        min-height: 54px;
        resize: vertical;
      }
      .finding-card {
        padding: 8px 0;
        border-top: 1px solid var(--border);
      }
      .finding-card strong { color: var(--fg); }
      .finding-card small { color: var(--fg-tertiary); }
      .directory-status {
        margin: 0 0 var(--space-3);
        font-size: 12px;
        color: var(--fg-tertiary);
      }

      .q-head {
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
        margin-bottom: var(--space-2);
      }

      .q-id {
        flex: none;
        width: 36px;
        padding-top: 1px;
        font-size: 13.5px;
        color: var(--fg-tertiary);
        transition: color 0.2s ease;
      }

      .q-body {
        flex: 1;
        min-width: 0;
      }
      .q-summary {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 4px;
      }
      .q-text {
        font-size: 16px;
        font-weight: 500;
        color: var(--fg);
        margin: 0;
      }

      /* Recommended hint under question */
      .q-recommended {
        font-size: 13px;
        color: var(--fg-tertiary);
        margin-top: 5px;
        padding-left: 0;
      }
      .q-recommended span {
        color: var(--ok);
        font-weight: 600;
      }

      .q-copy {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg-tertiary);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .q-copy:hover {
        color: var(--accent);
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .q-copy svg {
        width: 14px;
        height: 14px;
      }
      .q-copy.copied {
        color: var(--ok);
        border-color: var(--ok);
      }

      .options {
        list-style: none;
        margin: var(--space-2) 0 0;
        padding: 0 0 0 50px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .option {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        user-select: none;
        margin-bottom: 5px;
      }
      .option:hover {
        background: var(--surface);
      }
      .option.is-checked {
        background: var(--accent-soft);
        border-color: var(--accent-border);
      }
      .option.is-recommended:not(.is-checked) {
        background: #f7faf7;
        border-color: #cce4d6;
      }

      .opt-box {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        font-size: 16px;
        font-weight: 700;
        color: var(--fg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
        background: var(--bg);
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
      }
      .option.is-checked .opt-box {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }
      .option.is-recommended:not(.is-checked) .opt-box {
        border-color: var(--ok);
        color: var(--ok);
      }

      .opt-text {
        font-size: 14.5px;
        color: var(--fg-secondary);
        flex: 1;
        padding-top: 1px;
      }
      .option.is-checked .opt-text {
        color: var(--fg);
      }

      .opt-tag {
        flex: none;
        font-size: 11px;
        font-weight: 600;
        color: var(--ok);
        background: #ecf6f0;
        border: 1px solid #cce4d6;
        border-radius: 999px;
        padding: 2px 8px;
        margin-top: 2px;
        white-space: nowrap;
      }

      .note-wrap {
        padding-left: 50px;
        margin-top: var(--space-2);
      }

      .note-input {
        width: 100%;
        min-height: 38px;
        max-height: 180px;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 11px;
        line-height: 1.55;
      }
      .note-input:focus {
        outline: none;
        border-color: var(--accent-border);
        background: var(--bg);
      }
      .note-input::placeholder {
        color: var(--fg-tertiary);
      }

      footer {
        color: var(--fg-tertiary);
        font-size: 13px;
        padding-bottom: var(--space-6);
      }

      #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--fg);
        color: #fff;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        z-index: 60;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 560px) {
        .q-id {
          width: 28px;
          font-size: 12.5px;
        }
        .options {
          padding-left: 38px;
        }
        .note-wrap {
          padding-left: 38px;
        }
        .q-text {
          font-size: 15px;
        }
        .brand-title {
          font-size: 15px;
        }
        .progress {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        * {
          transition: none !important;
        }
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- print ---------- */

      #printSummary {
        display: none;
      }
      #printSummary h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      #printSummary .print-meta {
        font-size: 13px;
        color: #555;
        margin: 0 0 24px;
      }
      #printSummary .print-section {
        margin-bottom: 22px;
        break-inside: avoid;
      }
      #printSummary .print-section h2 {
        font-size: 14px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 5px;
        margin: 0 0 10px;
      }
      #printSummary .print-q {
        display: flex;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
        break-inside: avoid;
      }
      #printSummary .print-q-id {
        flex: none;
        width: 28px;
        font-size: 12px;
        color: #888;
        font-family: ui-monospace, monospace;
      }
      #printSummary .print-q-text {
        font-size: 14.5px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #printSummary .print-answer {
        font-size: 13.5px;
        color: #222;
      }
      #printSummary .print-answer .letter {
        font-weight: 700;
        margin-right: 3px;
      }
      #printSummary .print-answer.unanswered {
        color: #999;
        font-style: italic;
      }
      #printSummary .print-note {
        font-size: 13px;
        color: #555;
        margin-top: 3px;
      }

      @media print {
        body > *:not(#printSummary) {
          display: none !important;
        }
        #printSummary {
          display: block !important;
        }
        #toast {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="pageScroll">
      <header>
        <div class="header-inner">
          <div class="brand">
            <button class="btn toc-toggle" id="tocToggleBtn" type="button">
              <svg

              >
                <line x1="4" y1="6" x2="20" y2="6"></line>

            </button>

            <button

            <button class="btn" id="checkBtn">检查未完成</button>
            <button class="btn primary" id="copyAllBtn">复制全部答案</button>
            <span class="status-divider"></span>
            <button
              class="icon-btn"

              type="button"
              title="导出答案（供 Agent 读取）"
            >
              <svg
                viewBox="0 0 24 24"

                <path d="M12 3v12"></path>

            </button>
            <button

              id="importBtn"
              type="button"

            >
              <svg

              >
                <path d="M12 15V3"></path>

            <button class="btn" id="bindDirBtn" type="button" title="绑定当前组件访谈目录">绑定目录</button>

            <button

              >
                <path d="M6 9V2h12v7"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
                <path d="M4 9h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"></path>
                <path d="M6 17H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h2"></path>
              </svg>

      <div id="incompleteBanner">
        <div class="banner-box">
          <div class="banner-head">
            <span id="incompleteSummary"></span>
            <button class="banner-close" id="closeBanner">关闭</button>
          </div>
          <div class="chip-list" id="incompleteChips"></div>

      <div class="layout">
        <aside class="toc-sidebar" id="tocSidebar">
          <div class="toc-sidebar-inner" id="tocSidebarInner">
            <p class="toc-eyebrow">访谈轮次</p>
          </div>
        </aside>

        <div class="content-col">
          <main>
            <div class="intro">
              <p>
                选择选项表示决策；单选题只能选择一项，多选题可以选择多项。未知、待研究、待原型和疑问必须显式标记。绿底选项为推荐项，选中后变为蓝色。
                <span class="kbd-hint">
                  · <kbd>↑</kbd><kbd>↓</kbd> 切换题目 · <kbd>1</kbd>–<kbd
                    >4</kbd
                  >
                  选择选项</span
                >
              </p>
            </div>
            <div id="groups"></div>
            <section class="workflow-panel" id="userQuestionsPanel">
              <h2>我的疑问 / 反向问题</h2>
              <div class="directory-status" id="directoryStatus">未绑定目录；可继续使用手动导入/导出。</div>
              <p>这里的问题会进入下一轮访谈。它们不是设计决策，不能用备注代替。</p>
              <div id="userQuestionsList"></div>
              <button class="btn" id="addUserQuestionBtn" type="button">新增疑问</button>

            <section class="workflow-panel" id="findingsPanel">
              <h2>研究发现</h2>
              <p>以下内容由 Agent 根据资料整理，只读展示，不计入用户决策。</p>
              <div id="findingsList"></div>
            </section>
            <section class="workflow-panel" id="freezePanel">
              <h2>规格冻结门禁</h2>
              <p>只有选择“冻结”且不存在阻塞项，才允许生成冻结规格。</p>
              <div class="workflow-actions" id="freezeChoices">
                <label><input type="radio" name="freezeGate" value="freeze"> 冻结规格，生成 spec.md</label>
                <label><input type="radio" name="freezeGate" value="prototype"> 暂不冻结，生成 HTML 原型</label>
                <label><input type="radio" name="freezeGate" value="continue"> 仍有疑问，继续下一轮访谈</label>

    <div id="tocDrawer">

          <button class="drawer-close" id="drawerClose">

              viewBox="0 0 24 24"

            >

    <div id="toast"></div>
    <div id="printSummary"></div>

    <!-- data.js is written by the Agent for each component; this file never changes -->
    <script src="./data.js"></script>

    <script>
      (function () {
        const COMPONENT_NAME = window.COMPONENT_NAME || "";
        const SCHEMA_VERSION = Number(window.SCHEMA_VERSION || 1);
        const TEMPLATE_VERSION = window.TEMPLATE_VERSION || "1.0.0";
        const SECTIONS = window.SECTIONS || [];
        const QUESTIONS = window.QUESTIONS || [];
        const TOTAL = QUESTIONS.length;
        const FINDINGS = Array.isArray(window.FINDINGS) ? window.FINDINGS : [];

        // Set header subtitle
        const subtitleEl = document.getElementById("componentSubtitle");
        if (COMPONENT_NAME)
          subtitleEl.textContent = COMPONENT_NAME + " · " + TOTAL + " 个问题 · 模板 " + TEMPLATE_VERSION;
        document.title =
          "Yue Design · 组件设计访谈" +
          (COMPONENT_NAME ? " · " + COMPONENT_NAME : "");

        // Set footer
        const footerEl = document.getElementById("footerEl");
        footerEl.textContent =
          (COMPONENT_NAME || "组件") + " · " + TOTAL + " 个访谈问题";

        const state = {};
        QUESTIONS.forEach((q) => {
          state[q.id] = {
            letters: new Set(),
            value: "",
            note: "",
            status: q.type === "fact-question" ? "needs-research" : "unknown",
            round: Number(q.round || 1),
            introducedBy: q.introducedBy || null,
            supersedes: Array.isArray(q.supersedes) ? q.supersedes : [],
            updatedAt: null,
          };
        });

        document.getElementById("totalCount").textContent = TOTAL;

        const groupsEl = document.getElementById("groups");
        const decidedCountEl = document.getElementById("decidedCount");
        const statusSummaryEl = document.getElementById("statusSummary");
        const qRegistry = {};
        let userQuestions = [];
        let freezeGate = { choice: null, updatedAt: null };
        let directoryHandle = null;
        let currentActiveId = QUESTIONS.length ? QUESTIONS[0].id : 1;

        function questionType(q) {
          if (q.type) return q.type;
          return q.options && q.options.length ? "choice" : "open";
        }

        function hasFindingFor(id) {
          return FINDINGS.some((finding) => Array.isArray(finding.leadsTo) && finding.leadsTo.map(Number).includes(Number(id)));
        }

        function isDecided(q) {
          const s = state[q.id];
          return s.status === "decided" ||
            (s.status === "not-applicable" && s.note.trim().length > 0);
        }

        function hasInput(q) {
          const s = state[q.id];
          return s.letters.size > 0 || s.value.trim().length > 0 || s.note.trim().length > 0;
        }

        function isAnswered(id) {
          const q = QUESTIONS.find((x) => x.id === id);
          return q ? isDecided(q) : false;
        }

        function updateProgress() {
          let decided = 0;
          const counts = {};
          QUESTIONS.forEach((q) => {
            const status = state[q.id].status;
            counts[status] = (counts[status] || 0) + 1;
            if (isDecided(q)) decided++;
          });
          decidedCountEl.textContent = decided;
          const unresolved = QUESTIONS.filter((q) => q.required !== false && !isDecided(q) && q.type !== "fact-question").length;
          const openQuestions = userQuestions.filter((q) => q.status === "open").length;
          statusSummaryEl.textContent = unresolved || openQuestions ? "有阻塞项" : "可检查";
          renderBlocking();
          return decided;
        }

        function setStatus(q, status) {
          state[q.id].status = status;
          state[q.id].updatedAt = new Date().toISOString();
          const reg = qRegistry[q.id];
          if (reg) {
            reg.statusEl.value = status;
            reg.card.classList.toggle("answered", isDecided(q));
            reg.card.classList.toggle("blocked", !isDecided(q));
            setTocAnswered(q.id, isDecided(q));
          }
          updateProgress();
        }

        function freezeBlockers() {
          const blockers = [];
          const findingIds = new Set(FINDINGS.flatMap((finding) => Array.isArray(finding.leadsTo) ? finding.leadsTo : []));
          QUESTIONS.forEach((q) => {
            const s = state[q.id];
            if (q.type === "fact-question") {
              if ((s.status === "needs-research" || !s.value.trim()) && !findingIds.has(q.id)) blockers.push("Q" + q.id + " 研究事实尚未记录");
            } else if (q.required !== false && !isDecided(q)) {
              blockers.push("Q" + q.id + " " + q.summary + "：" + s.status);
            }
          });
          userQuestions.filter((item) => item.status === "open").forEach((item) => {
            blockers.push(item.id + " 用户疑问尚未解决");
          });
          return blockers;
        }

        function renderBlocking() {
          const list = document.getElementById("blockingList");
          if (!list) return;
          list.innerHTML = "";
          const blockers = freezeBlockers();
          if (!blockers.length) {
            const li = document.createElement("li");
            li.textContent = "没有阻塞项，可以进入冻结确认。";
            li.style.color = "var(--ok)";
            list.appendChild(li);
            return;
          }
          blockers.forEach((text) => {
            const li = document.createElement("li");
            li.textContent = text;
            list.appendChild(li);
          });
        }

        function renderFindings() {
          const root = document.getElementById("findingsList");
          root.innerHTML = "";
          if (!FINDINGS.length) {
            root.textContent = "暂无研究发现。";
            return;
          }
          FINDINGS.forEach((finding) => {
            const card = document.createElement("div");
            card.className = "finding-card";
            const title = document.createElement("strong");
            title.textContent = finding.topic || finding.id;
            const body = document.createElement("div");
            body.textContent = finding.finding || "";
            const source = document.createElement("small");
            source.textContent = "来源：" + (Array.isArray(finding.sources) ? finding.sources.join("、") : "未记录");
            card.append(title, body, source);
            root.appendChild(card);
          });
        }

        function renderUserQuestions() {
          const root = document.getElementById("userQuestionsList");
          root.innerHTML = "";
          userQuestions.forEach((item, index) => {
            const row = document.createElement("div");
            row.className = "user-question-row";
            row.classList.toggle("is-resolved", item.status === "resolved");
            const input = document.createElement("textarea");
            input.value = item.text || "";
            input.placeholder = "写下需要下一轮处理的问题";
            input.addEventListener("input", () => {
              item.text = input.value;
              item.status = item.text.trim() ? "open" : "empty";
              close.disabled = item.status === "empty";
              updateProgress();
            });
            const close = document.createElement("button");
            close.type = "button";
            close.className = "btn resolve-question-btn";
            close.textContent = item.status === "resolved" ? "取消解决" : "标记解决";
            close.title = item.status === "resolved" ? "重新打开这个疑问" : "将这个疑问标记为已解决";
            close.disabled = item.status === "empty";
            close.addEventListener("click", () => {
              item.status = item.status === "resolved" ? "open" : "resolved";
              renderUserQuestions();
              updateProgress();
            });
            row.append(input, close);
            root.appendChild(row);
          });
        }

        document.getElementById("addUserQuestionBtn").addEventListener("click", () => {
          userQuestions.push({
            id: "uq-" + String(userQuestions.length + 1),
            text: "",
            kind: "fact",
            relatedQuestionId: null,
            status: "empty",
            round: Math.max(1, ...QUESTIONS.map((q) => Number(q.round || 1))),
            resolution: null,
          });
          renderUserQuestions();
        });

        document.querySelectorAll('input[name="freezeGate"]').forEach((input) => {
          input.addEventListener("change", () => {
            freezeGate = { choice: input.value, updatedAt: new Date().toISOString() };
            document.querySelectorAll("#freezeChoices label").forEach((label) => label.classList.remove("selected"));
            input.closest("label").classList.add("selected");
            renderBlocking();
          });
        });

        const directoryStatusEl = document.getElementById("directoryStatus");
        const bindDirBtn = document.getElementById("bindDirBtn");
        if (!window.showDirectoryPicker) {
          bindDirBtn.disabled = true;
          bindDirBtn.title = "当前浏览器不支持目录绑定，请使用导入/导出";
        }
        bindDirBtn.addEventListener("click", async () => {
          if (!window.showDirectoryPicker) return;
          try {
            const handle = await window.showDirectoryPicker({ mode: "readwrite" });
            const dataHandle = await handle.getFileHandle("data.js");
            const dataText = await (await dataHandle.getFile()).text();
            if (!dataText.includes('window.COMPONENT_NAME = ' + JSON.stringify(COMPONENT_NAME))) {
              throw new Error("目录中的 data.js 与当前组件不匹配");
            }
            directoryHandle = handle;
            directoryStatusEl.textContent = "已绑定访谈目录；导出会直接写入 answers.json，并自动读取已有快照。";
            try {
              const answerHandle = await handle.getFileHandle("answers.json");
              const file = await answerHandle.getFile();
              const transfer = new DataTransfer();
              transfer.items.add(new File([await file.arrayBuffer()], "answers.json", { type: "application/json" }));
              importFileInput.files = transfer.files;
              importFileInput.dispatchEvent(new Event("change"));
            } catch (error) {
              if (error.name !== "NotFoundError") throw error;
            }
          } catch (error) {
            directoryHandle = null;
            directoryStatusEl.textContent = "目录绑定失败：" + error.message + "；可继续使用手动导入/导出。";
          }
        });

        function escapeHtml(str) {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        function setTocAnswered(id, answered) {
          document
            .querySelectorAll('[data-toc-q="' + id + '"]')
            .forEach((a) => {
              a.classList.toggle("answered", answered);
            });
        }

        function setTocActive(id) {
          currentActiveId = Number(id);
          document
            .querySelectorAll(".toc-item a")
            .forEach((a) => a.classList.remove("active"));
          document
            .querySelectorAll('[data-toc-q="' + id + '"]')
            .forEach((a) => {
              a.classList.add("active");
              if (a.scrollIntoView) a.scrollIntoView({ block: "nearest" });
            });
        }

        // ---- build TOC ----

        const CHEVRON_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
          'stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

        function buildToc(container) {
          SECTIONS.forEach((sec, i) => {
            const secId = "sec-" + (i + 1);
            const secWrap = document.createElement("div");
            secWrap.className = "toc-section";

            const row = document.createElement("div");

            const listWrap = document.createElement("div");

              const li = document.createElement("li");
              li.className = "toc-item";
              const a = document.createElement("a");

              a.dataset.tocQ = q.id;
              a.title = q.question;
              a.innerHTML =
                '<span class="toc-dot"></span>' +
                '<span class="toc-id mono">' +
                String(q.id).padStart(2, "0") +
                "</span>" +
                '<span class="toc-summary">' +

                "</span>";
              li.appendChild(a);
              ul.appendChild(li);

            listWrap.appendChild(ul);
            secWrap.appendChild(listWrap);
            container.appendChild(secWrap);

            requestAnimationFrame(() => {
              listWrap.style.maxHeight = listWrap.scrollHeight + "px";
            });

            collapseBtn.addEventListener("click", () => {
              const expanded =
                collapseBtn.getAttribute("aria-expanded") === "true";
              if (expanded) {
                listWrap.style.maxHeight = listWrap.scrollHeight + "px";
                requestAnimationFrame(() => {
                  listWrap.classList.add("collapsed");
                  listWrap.style.maxHeight = "0px";
                });
                collapseBtn.setAttribute("aria-expanded", "false");
              } else {
                listWrap.classList.remove("collapsed");
                listWrap.style.maxHeight = listWrap.scrollHeight + "px";
                collapseBtn.setAttribute("aria-expanded", "true");
                setTimeout(() => {
                  if (collapseBtn.getAttribute("aria-expanded") === "true") {
                    listWrap.style.maxHeight = "none";
                  }
                }, 240);
              }

          });

        buildToc(document.getElementById("tocSidebarInner"));
        buildToc(document.getElementById("tocDrawerList"));

        document
          .getElementById("tocDrawerList")
          .addEventListener("click", (e) => {

          });

        // ---- mobile drawer ----

        const pageScroll = document.getElementById("pageScroll");
        const drawer = document.getElementById("tocDrawer");
        function openDrawer() {
          drawer.classList.add("open");
          pageScroll.classList.add("no-scroll");
        }
        function closeDrawer() {
          drawer.classList.remove("open");
          pageScroll.classList.remove("no-scroll");
        }
        document
          .getElementById("tocBackdrop")
          .addEventListener("click", closeDrawer);
        document
          .getElementById("drawerClose")
          .addEventListener("click", closeDrawer);

        // ---- desktop sidebar collapse / mobile drawer toggle ----

        const desktopQuery = window.matchMedia("(min-width: 900px)");

        const tocToggleBtn = document.getElementById("tocToggleBtn");

        function setToggleState(open) {
          tocToggleBtn.classList.toggle("is-open", open);
          tocToggleBtn.setAttribute("aria-expanded", String(open));
        }

        setToggleState(true);

        tocToggleBtn.addEventListener("click", () => {
          if (desktopQuery.matches) {
            const nowCollapsed = tocSidebar.classList.toggle("collapsed");
            setToggleState(!nowCollapsed);
          } else {
            openDrawer();
          }

        // ---- icons ----

        const CLIP_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="8" y="2" width="8" height="4" rx="1"></rect>' +
          '<path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path>' +
          "</svg>";
        const CHECK_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
          'stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        const COPY_ROUND_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path>' +
          '<rect x="8" y="2" width="8" height="4" rx="1"></rect></svg>';

        function formatAnswer(id) {
          const s = state[id];
          const letters = Array.from(s.letters).sort().join("+");
          const note = s.note.trim();
          if (!letters && !note) return null;
          const q = QUESTIONS.find((x) => x.id === id);
          let line = "Q" + String(id).padStart(2, "0");
          if (q) line += " [" + q.summary + "]";
          if (letters) {
            const opts = q
              ? letters.split("+").map((l) => {
                  const o = q.options.find((x) => x.letter === l);
                  return l + ". " + (o ? o.text : "");
                })
              : [letters];
            line += " → " + opts.join(" / ");
          }
          if (note) line += (letters ? " · 补充：" : " · ") + note;
          return line;
        }

        // Format answers for a round (section)
        function formatRoundAnswers(sec) {
          const qs = QUESTIONS.filter(
            (q) => q.id >= sec.start && q.id <= sec.end,
          );
          const lines = [];
          lines.push("=== " + sec.title + " ===");
          qs.forEach((q) => {
            const line = formatAnswer(q.id);
            if (line) {
              lines.push(line);
            } else {
              lines.push(
                "Q" +
                  String(q.id).padStart(2, "0") +
                  " [" +
                  q.summary +
                  "] → 未作答（推荐：" +
                  q.recommended +
                  "）",
              );
            }
          });
          return lines.join("\n");
        }

        function flashCard(card) {
          card.classList.add("flash");
          setTimeout(() => card.classList.remove("flash"), 700);
        }

        function showToast(msg) {
          const t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(showToast._timer);
          showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
        }

        async function copyText(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            try {
              const ta = document.createElement("textarea");
              ta.value = text;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              return true;
            } catch (e2) {
              return false;
            }
          }
        }

        // ---- build main content ----

        SECTIONS.forEach((sec, i) => {

          section.className = "group";

          const heading = document.createElement("div");
          heading.className = "group-heading";

          const roundCopyBtn = document.createElement("button");
          roundCopyBtn.type = "button";
          roundCopyBtn.className = "round-copy-btn";
          roundCopyBtn.dataset.secIdx = i;
          roundCopyBtn.innerHTML = COPY_ROUND_SVG + "复制本轮";
          roundCopyBtn.title = "复制本轮所有答案（供 Agent 读取）";

          heading.appendChild(idxSpan);
          heading.appendChild(h2);
          heading.appendChild(roundCopyBtn);
          section.appendChild(heading);

          const items = QUESTIONS.filter(
            (q) => q.id >= sec.start && q.id <= sec.end,
          );
          items.forEach((q) => {
            const card = document.createElement("article");
            card.className = "q-card";
            card.id = "q-" + q.id;

            const type = questionType(q);
            const optionsEl = document.createElement("ul");
            optionsEl.className = "options";
            optionsEl.setAttribute("role", type === "choice" ? "radiogroup" : "group");
            if (type === "multi-choice") optionsEl.setAttribute("aria-multiselectable", "true");
            const optionEls = {};

            const qHead = document.createElement("div");
            qHead.className = "q-head";

            const qIdEl = document.createElement("div");
            qIdEl.className = "q-id mono";
            qIdEl.textContent = String(q.id).padStart(2, "0");

            const qBody = document.createElement("div");
            qBody.className = "q-body";

            const qSummary = document.createElement("div");
            qSummary.className = "q-summary";
            qSummary.textContent = q.summary;

            const qText = document.createElement("p");
            qText.className = "q-text";
            qText.textContent = q.question;

            const qRec = document.createElement("div");
            qRec.className = "q-recommended";
            qRec.innerHTML = "推荐：<span>" + (Array.isArray(q.recommended) ? q.recommended.join("、") : (q.recommended || "无")) + "</span>";

            qBody.appendChild(qSummary);
            qBody.appendChild(qText);
            qBody.appendChild(qRec);

            const qCopy = document.createElement("button");
            qCopy.type = "button";
            qCopy.className = "q-copy";
            qCopy.title = "复制该题答案";
            qCopy.innerHTML = CLIP_SVG;

            qHead.appendChild(qIdEl);
            qHead.appendChild(qBody);
            const statusLabels = {
              decided: "已决策",
              unknown: "未知",
              "needs-research": "待研究",
              "needs-prototype": "待原型",
              question: "有疑问",
              "not-applicable": "不适用",
            };
            const statusEl = document.createElement(type === "fact-question" ? "span" : "select");
            statusEl.className = type === "fact-question" ? "q-status q-status-readonly is-research" : "q-status";
            if (type === "fact-question") {
              statusEl.textContent = "Agent · " + (hasFindingFor(q.id) ? "已有研究发现" : statusLabels[state[q.id].status]);
              statusEl.title = "事实题状态由 Agent 的研究发现决定，不是用户选择";
            } else {
              [
                ["decided", "已决策"],
                ["unknown", "未知"],
                ["needs-research", "待研究"],
                ["needs-prototype", "待原型"],
                ["question", "有疑问"],
                ["not-applicable", "不适用"],
              ].forEach(([value, label]) => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = label;
                statusEl.appendChild(option);
              });
              statusEl.value = state[q.id].status;
              statusEl.addEventListener("change", () => setStatus(q, statusEl.value));
            }
            qRegistry[q.id] = { card, optionEls, statusEl };
            qHead.appendChild(statusEl);
            qHead.appendChild(qCopy);
            card.appendChild(qHead);

            // Intersection observer to update active TOC item
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) setTocActive(q.id);
                });
              },
              { rootMargin: "-20% 0px -70% 0px" },
            );
            observer.observe(card);

            if (type === "choice" || type === "multi-choice") q.options.forEach((o) => {
              const li = document.createElement("li");
              li.className =
                "option" + (o.recommended ? " is-recommended" : "");
              li.dataset.letter = o.letter;
              li.setAttribute("role", type === "choice" ? "radio" : "checkbox");
              li.setAttribute("aria-checked", "false");
              li.setAttribute("tabindex", "0");

              const box = document.createElement("span");
              box.className = "opt-box";
              box.textContent = o.letter;

              const text = document.createElement("span");
              text.className = "opt-text";
              text.textContent = o.text;

              li.appendChild(box);
              li.appendChild(text);

              if (o.recommended) {
                const tag = document.createElement("span");
                tag.className = "opt-tag";
                tag.textContent = "推荐";
                li.appendChild(tag);
              }

              optionEls[o.letter] = li;
              optionsEl.appendChild(li);

              function toggle() {
                const checked = state[q.id].letters.has(o.letter);
                if (checked) {
                  state[q.id].letters.delete(o.letter);
                  li.classList.remove("is-checked");
                  li.setAttribute("aria-checked", "false");
                } else {
                  state[q.id].letters.add(o.letter);
                  li.classList.add("is-checked");
                  li.setAttribute("aria-checked", "true");
                }
                if (type === "choice") {
                  state[q.id].letters = new Set([o.letter]);
                  Object.entries(optionEls).forEach(([letter, element]) => {
                    const checked = letter === o.letter;
                    element.classList.toggle("is-checked", checked);
                    element.setAttribute("aria-checked", String(checked));
                  });
                }
                state[q.id].status = "decided";
                statusEl.value = "decided";
                state[q.id].updatedAt = new Date().toISOString();
                const ans = isDecided(q);
                card.classList.toggle("answered", ans);
                setTocAnswered(q.id, ans);
                updateProgress();
              }

              li.addEventListener("click", toggle);
              li.addEventListener("keydown", (e) => {
                if (e.key === " " || e.key === "Enter") {
                  e.preventDefault();
                  toggle();
                }
              });
            });

            if (type === "choice" || type === "multi-choice") card.appendChild(optionsEl);

            if (type === "open" || type === "fact-question" || type === "prototype-gate") {
              const valueEl = document.createElement("textarea");
              valueEl.className = "open-answer";
              valueEl.placeholder = type === "fact-question" ? "研究问题或事实说明（由 Agent 填写）" : "填写你的回答";
              valueEl.value = state[q.id].value;
              qRegistry[q.id].valueEl = valueEl;
              valueEl.addEventListener("input", () => {
                state[q.id].value = valueEl.value;
                if (valueEl.value.trim()) {
                  state[q.id].status = type === "fact-question" ? "needs-research" : "decided";
                  statusEl.value = state[q.id].status;
                }
                state[q.id].updatedAt = new Date().toISOString();
                updateProgress();
              });
              card.appendChild(valueEl);
            }

            // Note textarea
            const noteWrap = document.createElement("div");
            noteWrap.className = "note-wrap";
            const noteEl = document.createElement("textarea");
            noteEl.className = "note-input";
            noteEl.placeholder = "补充说明（可选）";
            noteEl.rows = 1;
            qRegistry[q.id].noteEl = noteEl;
            noteEl.addEventListener("input", () => {
              state[q.id].note = noteEl.value;
              const ans = isDecided(q);
              card.classList.toggle("answered", ans);
              setTocAnswered(q.id, ans);
              updateProgress();
            });
            noteWrap.appendChild(noteEl);
            card.appendChild(noteWrap);

            section.appendChild(card);

            // Per-question copy
            qCopy.addEventListener("click", async () => {
              const line =
                formatAnswer(q.id) ||
                "Q" +
                  String(q.id).padStart(2, "0") +
                  " [" +
                  q.summary +
                  "] → 未作答";
              const ok = await copyText(line);
              if (ok) {
                qCopy.innerHTML = CHECK_SVG;
                qCopy.classList.add("copied");
                showToast("已复制");
                setTimeout(() => {
                  qCopy.innerHTML = CLIP_SVG;
                  qCopy.classList.remove("copied");
                }, 1500);
              }
            });
          });

          groupsEl.appendChild(section);

          // Per-round copy
          roundCopyBtn.addEventListener("click", async () => {
            const text = formatRoundAnswers(sec);
            const ok = await copyText(text);
            if (ok) {
              roundCopyBtn.innerHTML = CHECK_SVG + " 已复制";
              roundCopyBtn.classList.add("copied");
              showToast("已复制 · " + sec.title);
              setTimeout(() => {
                roundCopyBtn.innerHTML = COPY_ROUND_SVG + "复制本轮";
                roundCopyBtn.classList.remove("copied");
              }, 1800);
            }
          });
        });

        // ---- fill recommended ----

        document.getElementById("fillRecBtn").addEventListener("click", () => {
          let filled = 0;
          QUESTIONS.forEach((q) => {
            if (!isAnswered(q.id)) {
              const reg = qRegistry[q.id];
              if (!reg) return;
              const letters = Array.isArray(q.recommended) ? q.recommended : (q.recommended ? [q.recommended] : []);
              if (!letters.length || !q.options || !q.options.length) return;
              state[q.id].letters = new Set(letters);
              letters.forEach((letter) => {
                if (reg.optionEls[letter]) {
                  reg.optionEls[letter].classList.add("is-checked");
                  reg.optionEls[letter].setAttribute("aria-checked", "true");
                }
              });
              state[q.id].status = "decided";
              if (reg.statusEl) reg.statusEl.value = "decided";
              reg.card.classList.add("answered");
              setTocAnswered(q.id, true);
              filled++;
            }
          });
          updateProgress();
          showToast(
            filled > 0
              ? "已为 " + filled + " 题填入推荐项"
              : "所有题目均已作答",
          );
        });

        // ---- check incomplete ----

        document.getElementById("checkBtn").addEventListener("click", () => {
          const unanswered = QUESTIONS.filter((q) => q.required !== false && !isDecided(q));
          const banner = document.getElementById("incompleteBanner");
          const summary = document.getElementById("incompleteSummary");
          const chips = document.getElementById("incompleteChips");

          const blockers = freezeBlockers();
          if (unanswered.length === 0 && blockers.length === 0) {
            banner.classList.remove("show");
            showToast("所有题目均已作答 ✓");
            return;
          }

          summary.textContent = blockers.length ? "还有 " + blockers.length + " 个阻塞项" : "所有必答项已完成";
          chips.innerHTML = "";
          unanswered.forEach((q) => {
            const a = document.createElement("a");
            a.className = "chip";
            a.href = "#q-" + q.id;
            a.textContent = String(q.id).padStart(2, "0") + " " + q.summary;
            a.addEventListener("click", () => {
              banner.classList.remove("show");
            });
            chips.appendChild(a);
          });
          if (!unanswered.length) {
            blockers.forEach((item) => {
              const a = document.createElement("span");
              a.className = "chip";
              a.textContent = item;
              chips.appendChild(a);
            });
          }
          banner.classList.add("show");
        });

        document.getElementById("closeBanner").addEventListener("click", () => {
          document.getElementById("incompleteBanner").classList.remove("show");

        // ---- copy all ----

        document
          .getElementById("copyAllBtn")
          .addEventListener("click", async () => {
            const lines = [];
            if (COMPONENT_NAME)
              lines.push("# " + COMPONENT_NAME + " 组件设计访谈答案\n");
            SECTIONS.forEach((sec) => {
              lines.push(formatRoundAnswers(sec));
              lines.push("");
            });
            const text = lines.join("\n").trim();
            const ok = await copyText(text);
            if (ok) showToast("已复制全部答案");
          });

        // ---- export JSON ----

        async function buildExportPayload() {
          const answers = {};
          QUESTIONS.forEach((q) => {
            const s = state[q.id];
            answers[q.id] = {
              type: questionType(q),
              status: s.status,
              summary: q.summary,
              letters: Array.from(s.letters).sort(),
              value: s.value,
              note: s.note,
              recommended: Array.isArray(q.recommended) ? q.recommended : (q.recommended ? [q.recommended] : []),
              round: s.round,
              introducedBy: s.introducedBy,
              supersedes: s.supersedes,
              updatedAt: s.updatedAt,
            };
          });
          const payload = {
            schemaVersion: 2,
            component: COMPONENT_NAME,
            templateVersion: TEMPLATE_VERSION,
            exportedAt: new Date().toISOString(),
            round: Math.max(1, ...QUESTIONS.map((q) => Number(q.round || 1))),
            totalQuestions: TOTAL,
            decidedCount: updateProgress(),
            userQuestions,
            findings: FINDINGS,
            freezeGate,
            answers,
          };
          return payload;
        }

        document.getElementById("exportBtn").addEventListener("click", async () => {
          const payload = await buildExportPayload();
          const json = JSON.stringify(payload, null, 2);
          if (directoryHandle) {
            try {
              const answerHandle = await directoryHandle.getFileHandle("answers.json", { create: true });
              const writable = await answerHandle.createWritable();
              await writable.write(json);
              await writable.close();
              try {
                const historyDir = await directoryHandle.getDirectoryHandle("history", { create: true });
                const historyHandle = await historyDir.getFileHandle("answers-r" + String(payload.round).padStart(3, "0") + ".json", { create: true });
                const historyWritable = await historyHandle.createWritable();
                await historyWritable.write(json);
                await historyWritable.close();
              } catch (historyError) {
                directoryStatusEl.textContent = "当前快照已保存，但历史快照写入失败：" + historyError.message;
              }
              showToast("已保存到访谈目录");
              return;
            } catch (error) {
              directoryStatusEl.textContent = "目录写入失败：" + error.message + "；已改用下载备份。";
            }
          }
          const blob = new Blob([json], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = COMPONENT_NAME ? COMPONENT_NAME.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".answers.json" : "answers.json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("已导出 JSON 备份");
        });

        // ---- import JSON ----

        const importFileInput = document.getElementById("importFile");
        document.getElementById("importBtn").addEventListener("click", () => {
          importFileInput.value = "";
          importFileInput.click();
        });

        importFileInput.addEventListener("change", () => {
          const file = importFileInput.files && importFileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            let data;
            try {
              data = JSON.parse(String(reader.result));
            } catch (e) {
              showToast("文件不是有效的 JSON");
              return;
            }
            const answers = data && data.answers;
            if (!answers || typeof answers !== "object") {
              showToast("文件格式不对，缺少 answers 字段");
              return;
            }
            let restored = 0,
              skipped = 0;
            const schemaVersion = Number(data.schemaVersion || 1);
            Object.keys(answers).forEach((key) => {
              const id = Number(key);
              const q = QUESTIONS.find((x) => x.id === id);
              const reg = qRegistry[id];
              if (!q || !reg) {
                skipped++;
                return;
              }
              const entry = answers[key] || {};
              const letters = Array.isArray(entry.letters) ? entry.letters : [];
              const note = typeof entry.note === "string" ? entry.note : "";
              const type = questionType(q);

              state[id].letters = new Set(
                letters.filter((l) => reg.optionEls[l]),
              );
              state[id].value = typeof entry.value === "string" ? entry.value : "";
              state[id].note = note;
              state[id].status = schemaVersion >= 2 && typeof entry.status === "string"
                ? entry.status
                : (state[id].letters.size || state[id].value.trim() ? "decided" : "unknown");
              state[id].round = Number(entry.round || q.round || 1);
              state[id].introducedBy = entry.introducedBy || q.introducedBy || null;
              state[id].supersedes = Array.isArray(entry.supersedes) ? entry.supersedes : [];
              state[id].updatedAt = entry.updatedAt || null;

              Object.keys(reg.optionEls).forEach((letter) => {
                const checked = state[id].letters.has(letter);
                reg.optionEls[letter].classList.toggle("is-checked", checked);
                reg.optionEls[letter].setAttribute(
                  "aria-checked",
                  String(checked),
                );
              });
              if (reg.noteEl) reg.noteEl.value = note;
              if (reg.valueEl) reg.valueEl.value = state[id].value;
              if (reg.statusEl) {
                if (reg.statusEl.tagName === "SELECT") reg.statusEl.value = state[id].status;
                else reg.statusEl.textContent = "Agent · " + (hasFindingFor(id) ? "已有研究发现" : {
                  "needs-research": "待研究",
                  "needs-prototype": "待原型",
                  question: "有疑问",
                  unknown: "未知",
                  decided: "已决策",
                  "not-applicable": "不适用",
                }[state[id].status]);
              }

              const ans = isDecided(q);
              reg.card.classList.toggle("answered", ans);
              setTocAnswered(id, ans);
              restored++;
            });
            if (Array.isArray(data.userQuestions)) userQuestions = data.userQuestions;
            if (data.freezeGate && typeof data.freezeGate === "object") {
              freezeGate = data.freezeGate;
              const selected = document.querySelector('input[name="freezeGate"][value="' + freezeGate.choice + '"]');
              if (selected) {
                selected.checked = true;
                selected.closest("label").classList.add("selected");
              }
            }
            renderUserQuestions();
            updateProgress();
            showToast(
              "已导入 " +
                restored +
                " 题" +
                (skipped ? "，跳过 " + skipped + " 项" : "") +
                (schemaVersion < 2 ? "（旧格式已迁移为 schema v2）" : ""),
            );
          };
          reader.readAsText(file);
        });

        // ---- print ----

        function buildPrintSummary() {
          const root = document.getElementById("printSummary");
          const n = updateProgress();
          const now = new Date();
          const dateStr =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(now.getDate()).padStart(2, "0");

          let html =
            "<h1>Yue Design · " +
            (COMPONENT_NAME || "组件") +
            " 设计访谈 · 答案汇总</h1>" +
            '<p class="print-meta">生成于 ' +
            dateStr +
            " · 共 " +
            TOTAL +
            " 题，已作答 " +
            n +
            " 题</p>";

          SECTIONS.forEach((sec, i) => {
            html +=
              '<div class="print-section"><h2>' +
              (i + 1) +
              ". " +
              escapeHtml(sec.title) +
              "</h2>";
            QUESTIONS.filter(
              (q) => q.id >= sec.start && q.id <= sec.end,
            ).forEach((q) => {
              const s = state[q.id];
              const letters = Array.from(s.letters).sort();
              const note = s.note.trim();
              let answerHtml;
              if (letters.length === 0 && !note) {
                answerHtml =
                  '<div class="print-answer unanswered">未作答（推荐项：' +
                  q.recommended +
                  "）</div>";
              } else {
                const parts = letters.map((letter) => {
                  const opt = q.options.find((o) => o.letter === letter);
                  return (
                    '<span class="letter">' +
                    letter +
                    ".</span>" +
                    escapeHtml(opt ? opt.text : "")
                  );
                });
                answerHtml =
                  '<div class="print-answer">' + parts.join("<br>") + "</div>";
                if (note)
                  answerHtml +=
                    '<div class="print-note">补充：' +
                    escapeHtml(note) +
                    "</div>";
              }
              html +=
                '<div class="print-q">' +
                '<div class="print-q-id">' +
                String(q.id).padStart(2, "0") +
                "</div>" +
                "<div>" +
                '<div class="print-q-text">' +
                escapeHtml(q.summary) +
                "：" +
                escapeHtml(q.question) +
                "</div>" +
                answerHtml +
                "</div>" +
                "</div>";
            });
            html += "</div>";
          });

          root.innerHTML = html;
        }

        document.getElementById("printBtn").addEventListener("click", () => {
          buildPrintSummary();
          requestAnimationFrame(() => {
            window.print();
          });
        });

        // ---- keyboard shortcuts ----

        function focusQuestion(id) {
          const card = document.getElementById("q-" + id);
          if (!card) return;
          card.scrollIntoView({ behavior: "smooth", block: "start" });
          setTocActive(id);
          flashCard(card);
        }

        document.addEventListener("keydown", (e) => {
          const tag = (
            (document.activeElement && document.activeElement.tagName) ||
            ""
          ).toLowerCase();
          if (tag === "textarea" || tag === "input") return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (drawer.classList.contains("open")) return;

          if (e.key === "ArrowDown" || e.key === "ArrowRight") {
            e.preventDefault();
            const idx = QUESTIONS.findIndex((q) => q.id === currentActiveId);
            const next = QUESTIONS[Math.min(idx + 1, QUESTIONS.length - 1)];
            if (next) focusQuestion(next.id);
          } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
            e.preventDefault();
            const idx = QUESTIONS.findIndex((q) => q.id === currentActiveId);
            const prev = QUESTIONS[Math.max(idx - 1, 0)];
            if (prev) focusQuestion(prev.id);
          } else if (["1", "2", "3", "4"].includes(e.key)) {
            const q = QUESTIONS.find((x) => x.id === currentActiveId);
            const reg = q && qRegistry[q.id];
            if (!reg) return;
            const letter = ["A", "B", "C", "D"][Number(e.key) - 1];
            const li = reg.optionEls[letter];
            if (li) li.click();
          }
        });

        renderFindings();
        renderUserQuestions();
        updateProgress();
      })();
    </script>
  </body>
</html>
